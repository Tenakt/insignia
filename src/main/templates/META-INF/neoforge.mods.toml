modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

authors="GrindlesStudio"

description='''
Insignia — мод для управления группами и префиксами игроков.

Возможности:
- Создание шаблонов групп и префиксов.
- Назначение личных групп и префиксов игрокам.
- Настройка отображения тегов в чате и таб-листе.
- Настраиваемое название сервера в таб-листе.
- Поддержка русских и английских команд.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"