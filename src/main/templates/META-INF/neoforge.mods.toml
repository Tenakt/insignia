modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

authors="GrindlesStudio"

description='''
Insignia is a server-focused utility for managing player groups and prefixes.
Features include reusable group and prefix templates, per-player custom tags,
independent chat and player-list display settings, a configurable player-list
header, persistent JSON data, and Russian/English commands.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"